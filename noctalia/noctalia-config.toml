[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.2
enabled = true
tint_intensity = 0.0

[bar.default]
background_opacity = 0.0
capsule_opacity = 0.5
capsule_radius = 7
capsule_thickness = 0.75
compositor_blur = false
capsule = true
center = [ "active_window" ]
end = [ "tray", "notifications", "group:g1", "group:g2", "clock", "session" ]
margin_ends = "2%"
radius_top_left = 0
radius_top_right = 0
start = [ "workspaces", "media", "group:g3" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "bluetooth", "network" ]
    opacity = 0.5
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g2"
    members = [ "volume", "brightness", "battery" ]
    opacity = 0.5
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g3"
    members = [ "mon_cputemp", "cpu", "ram", "mon_disk" ]
    opacity = 0.5
    padding = 6.0

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false

[lockscreen]
transition = [ "crt", "pixel" ]
transition_duration = 500

[lockscreen_widgets]
enabled = false

[shell.panel]
control_center_placement = "floating"
control_center_position = "top_center"

[shell.launcher]
categories = false
layout = "simple"
pinned = [ "librewolf" ]

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

[wallpaper]
directory = "/home/martin/Sync/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600
    recursive = true

[widget.active_window]
max_length = 800

[widget.brightness]
peek = true

[widget.clock]
tooltip_format = "{:%A, %d-%m-%Y}"

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
peek = true
show_vpn_label = true
vpn_status = "both"

[widget.workspaces]
show_labels = false

[widget.cpu]
show_cpu_cores = true
show_value = false

[widget.mon_cputemp]
label_show_units = false
show_value = false
stat = "cpu_temp"
type = "sysmon"

[widget.mon_disk]
show_value = false
stat = "disk_free"
type = "sysmon"

[widget.ram]
show_value = false

[widget.sysmon]
show_cpu_cores = true
stat = "disk_free"
